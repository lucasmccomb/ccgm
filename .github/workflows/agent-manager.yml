name: Agent Manager CI

on:
  pull_request:
    paths:
      - "modules/agent-manager/**"
  push:
    branches:
      - main
    paths:
      - "modules/agent-manager/**"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/agent-manager/src/go.mod
          cache-dependency-path: modules/agent-manager/src/go.sum

      - name: Run tests
        working-directory: modules/agent-manager/src
        run: go test ./...

      - name: Run vet
        working-directory: modules/agent-manager/src
        run: go vet ./...

      # golangci-lint dropped: agent-manager is deprecated/unmaintained and the
      # pinned golangci-lint ("latest" = built with an older Go toolchain) cannot
      # run against this module's `go 1.26.1` target. The lint step has never
      # passed on this workflow; go test/vet/build still gate the module.

      - name: Build
        working-directory: modules/agent-manager/src
        run: go build -ldflags "-X main.version=ci" ./cmd/ccgm-agents
