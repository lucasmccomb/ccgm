name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate modules
        run: bash tests/test-modules.sh

      - name: Cross-module invocation detector self-test
        run: bash tests/test-cross-module-invocations.sh --self-test

      - name: Cross-module invocations declared or guarded
        run: bash tests/test-cross-module-invocations.sh

      - name: Doc-count detector self-test
        run: bash tests/test-doc-counts.sh --self-test

      - name: Check doc counts + preset coverage
        run: bash tests/test-doc-counts.sh

      - name: Validate command/skill/agent frontmatter YAML
        run: bash tests/test-frontmatter-yaml.sh

      - name: Plugin marketplace in sync (generator --check)
        run: python3 modules/plugin-marketplace/lib/gen_marketplace.py --check

      - name: Validate plugin marketplace + manifests
        run: python3 modules/plugin-marketplace/lib/validate_marketplace.py

      - name: Personal-data detector self-test
        run: bash tests/test-no-personal-data.sh --self-test

      - name: Check personal data
        run: bash tests/test-no-personal-data.sh

      - name: Test templates
        run: bash tests/test-templates.sh

      - name: Test settings merge
        run: bash tests/test-merge.sh

      - name: Test backup/restore
        run: bash tests/test-backup.sh

      - name: Test installer (minimal)
        run: bash tests/test-installer.sh

      - name: Test link mode
        run: bash tests/test-link-mode.sh

      - name: Test uninstall settings preservation
        run: bash tests/test-uninstall-settings.sh

      - name: Audit skill test suite
        run: bash tests/run-audit-suite.sh

      - name: xplan-web-review smoke tests
        run: bash tests/test-xplan-web-review.sh

      - name: Hooks test suites (dispatcher equivalence + precedence)
        run: |
          set -e
          # enforce-git-workflow.py imports hook_utils from ~/.claude/lib, so the
          # suites need the hooks lib on that path (an installed-environment
          # assumption). Stage it before running.
          mkdir -p "$HOME/.claude/lib"
          cp modules/hooks/lib/*.py "$HOME/.claude/lib/"
          for t in modules/hooks/tests/*.sh modules/branch-guard/tests/*.sh modules/ask-context/tests/*.sh modules/git-worktrees/tests/*.sh; do
            echo "=== Running $t ==="
            bash "$t"
          done

      - name: relevance-injection - /rules-scope pytest (Epic 0.5, issue #952)
        run: |
          set -e
          python3 -m venv /tmp/ccgm-rules-scope-test-venv
          source /tmp/ccgm-rules-scope-test-venv/bin/activate
          python3 -m pip install --quiet pytest
          python3 -m pytest modules/relevance-injection/tests/test_rules_scope.py -q

      - name: relevance-injection - /rules-scope bash suite (E2E self-skips without an authenticated claude CLI)
        run: bash modules/relevance-injection/tests/test-rules-scope.sh

      - name: Dreaming module tests (pytest + self-check + offline chain)
        env:
          # Some dreaming tests exercise real git repos via subprocess
          # (ccgm-learnings-sync init, ad-hoc `git commit`) without an
          # explicit env= override, so they inherit whatever identity is
          # ambient. Every dev machine has a global git identity already
          # configured; a fresh hosted runner has none, and its service
          # account's blank GECOS name makes git's own auto-derived
          # fallback fail with "empty ident name ... not allowed". Git
          # env vars are the highest-priority identity source (override
          # config files and any HOME redirection a test performs), so
          # setting them here fixes every such call site without editing
          # the test files themselves.
          GIT_AUTHOR_NAME: CCGM CI
          GIT_AUTHOR_EMAIL: ci@ccgm.invalid
          GIT_COMMITTER_NAME: CCGM CI
          GIT_COMMITTER_EMAIL: ci@ccgm.invalid
        run: |
          set -e
          # System python3 on hosted runners is PEP 668 "externally
          # managed" -- a venv sidesteps that entirely instead of gambling
          # on --break-system-packages support across runner images.
          python3 -m venv /tmp/ccgm-dreaming-test-venv
          source /tmp/ccgm-dreaming-test-venv/bin/activate
          python3 -m pip install --quiet pytest
          python3 -m pytest modules/dreaming/tests/ -q
          python3 modules/dreaming/lib/transcript_miner.py --self-check
          CCGM_DREAMING_DIR=$(mktemp -d) CCGM_LEARNINGS_DIR=$(mktemp -d) \
            bash modules/dreaming/bin/dream-daily.sh \
              --offline modules/dreaming/tests/fixtures/offline-responses \
              --force-day 2026-01-02

      # --- orrery module (plan section 8.4: named steps in BOTH jobs) --------
      - name: Orrery - setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Orrery - read pinned playwright version
        id: orrery-pw
        run: echo "version=$(python3 -c "import json; print(json.load(open('modules/orrery/skills/orrery/scripts/toolchain/package-lock.json'))['packages']['node_modules/playwright']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Orrery - cache npm store (keyed by lockfile hash)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-orrery-npm-${{ hashFiles('modules/orrery/skills/orrery/scripts/toolchain/package-lock.json') }}

      - name: Orrery - cache playwright browsers (keyed by playwright version)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-orrery-playwright-${{ steps.orrery-pw.outputs.version }}

      - name: Orrery - install playwright chromium (via pinned toolchain)
        # Retry once on a transient download failure (plan section 11 browser-
        # provisioning row); a second failure fails the step.
        run: |
          bash modules/orrery/skills/orrery/scripts/likec4.sh playwright install chromium --with-deps \
            || bash modules/orrery/skills/orrery/scripts/likec4.sh playwright install chromium --with-deps

      - name: Orrery module tests (ORRERY_STRICT=1)
        run: |
          set -e
          # pytest is not ambient on hosted runners (PEP 668) - venv-install it,
          # same pattern as the dreaming step above.
          python3 -m venv /tmp/ccgm-orrery-test-venv
          source /tmp/ccgm-orrery-test-venv/bin/activate
          python3 -m pip install --quiet pytest
          ORRERY_STRICT=1 bash modules/orrery/tests/test-orrery.sh

